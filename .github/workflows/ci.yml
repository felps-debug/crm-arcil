name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This job is a no-op until a Playwright config lands in the repo root.
      # Every later step is gated on this check so the workflow never fails
      # while e2e tests don't exist yet, and auto-activates once they do.
      - name: Check for Playwright config
        id: playwright_check
        shell: bash
        run: |
          if [ -f "playwright.config.ts" ] || [ -f "playwright.config.js" ]; then
            echo "has_e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_e2e=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.playwright_check.outputs.has_e2e == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        if: steps.playwright_check.outputs.has_e2e == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.playwright_check.outputs.has_e2e == 'true'
        run: npx playwright install --with-deps

      - name: Run E2E tests
        if: steps.playwright_check.outputs.has_e2e == 'true'
        run: npm run test:e2e
